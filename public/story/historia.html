<script>
async function arrancar(){
  /* Plantilla sin datos (tiene el marcador en vez del JSON): intenta cargar ../data por http; con file:// explica qué hacer. */
  const crudo=document.getElementById('data').textContent.trim();
  if(crudo[0]==='{')return iniciar(JSON.parse(crudo));
  if(window.DATOS)return iniciar(window.DATOS); /* ../data/historia_opportunity.js, sirve también con file:// */
  try{
    const r=await fetch('../data/historia_opportunity.json');
    if(!r.ok)throw new Error(r.status);
    return iniciar(await r.json());
  }catch(_){
    document.body.innerHTML='<div style="max-width:620px;margin:60px auto;padding:0 16px;font:16px/1.6 system-ui"><h2>Esto es una plantilla sin datos</h2><p>Abre el HTML ya generado: <code>public/story/historia.html</code> (en <code>npm run dev</code>: <code>/story/historia.html</code>).</p><p>Para regenerarlo: <code>python story/build_historia.py</code>.</p><p>Si sirves la carpeta <code>story/</code> por http, la plantilla carga <code>../data/historia_opportunity.json</code> sola.</p></div>';
  }
}
function iniciar(D){
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(_){return 'fuente'}};
$('#t').textContent=D.titulo;
$('#s').textContent=`${D.publico} · ${D.resumen.eventos} eventos · ${D.resumen.con_fuente_fuerte} con fuente oficial o científica · ${D.resumen.con_fuente_debil.length} con fuente débil`;
$('#aviso').textContent=D.aviso;
$('#nav').innerHTML=D.actos.map(a=>`<a href="#acto${a.n}">${a.n}. ${esc(a.titulo)}</a>`).join('')+'<span class="sp"></span><span class="meta"><kbd>j</kbd>/<kbd>k</kbd> mover</span><button class="b" id="dl">Descargar JSON</button>';
const fecha=e=>e.fecha_fin?`${e.fecha_inicio} → ${e.fecha_fin}`:e.fecha_inicio;
let h='',last=0;
for(const e of D.eventos){
 if(e.acto!==last){last=e.acto;h+=`<div class="acto" id="acto${e.acto}">Acto ${e.acto} · ${esc(e.acto_titulo)}</div>`}
 const n=e.narrativa,f=e.hechos;
 h+=`<article class="ev" id="${e.id}"><div class="top"><span class="num">${e.orden_historia}</span><b>${esc(fecha(e))}</b>${e.sol!=null?`<span>sol ${e.sol}</span>`:''}<span class="tag">${e.id}</span>
 <span class="tag ${e.solidez_fuentes==='fuerte'?'ok':'warn'}">${e.solidez_fuentes==='fuerte'?'✓ fuente oficial/científica':'⚠ fuente débil'}</span>${f.discutido?'<span class="tag warn">⚠ discutido</span>':''}</div>
 <h3>${esc(e.titulo)}</h3><div class="gancho">${esc(n.gancho)}</div>
 <div class="grid"><div class="box"><b>Escena visual</b>${esc(n.escena_visual)} <button class="b" data-copy="${esc(n.escena_visual)}">Copiar</button></div>
 <div class="box"><b>Emoción</b>${esc(n.emocion)}<b style="margin-top:6px">Elementos</b>${n.elementos.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>
 <div class="box"><b>Por qué se eligió</b>${esc(n.por_que_se_eligio)}</div>
 <div style="margin-top:8px">${e.fuentes.map(s=>`<a class="lnk ${['oficial NASA/JPL','científica'].includes(s.tipo)?'s':''}" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.titulo+' · '+s.tipo)}">🔗 ${esc(s.editor||host(s.url))}</a>`).join('')}</div>
 <div class="meta">🔎 Para el agente de fuentes: ${esc(e.busqueda_sugerida)}</div>
 <details><summary>Hechos originales</summary><p>${esc(f.detalle)}</p>${f.datos_clave.length?`<ul>${f.datos_clave.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${f.nota?`<div class="nota">📝 ${esc(f.nota)}</div>`:''}</details></article>`}
$('#out').innerHTML=h;
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){navigator.clipboard?.writeText(c.dataset.copy);c.textContent='Copiado'}});
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='historia_opportunity.json';a.click()};
let cur=-1;const cards=[...document.querySelectorAll('.ev')];
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const d=e.key==='j'||e.key==='ArrowDown'?1:e.key==='k'||e.key==='ArrowUp'?-1:0;if(!d)return;e.preventDefault();
 cards[cur]?.classList.remove('cur');cur=Math.max(0,Math.min(cards.length-1,cur+d));cards[cur].classList.add('cur');cards[cur].scrollIntoView({block:'start',behavior:'smooth'})});

}
arrancar();
</script></body></html>
